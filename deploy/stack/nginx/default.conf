# Single entry: Open WebUI on / , llama-server OpenAI API on /v1/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream llama_server {
    server llama-server:8080;
}

upstream open_webui {
    server open-webui:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # OpenAI-compatible API (external clients)
    location /v1/ {
        proxy_pass http://llama_server;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Authorization $http_authorization;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /health {
        proxy_pass http://llama_server/health;
    }

    location = /metrics {
        proxy_pass http://llama_server/metrics;
    }

    # Built-in llama-server UI (debug)
    location /llama/ {
        proxy_pass http://llama_server/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Open WebUI (chat)
    location / {
        proxy_pass http://open_webui;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
